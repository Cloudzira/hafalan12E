<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capaian HafalanKu</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #fbebf0 50%, #f7f3f6 100%);
      --primary: #d47a8f;       /* Soft Rose / Dusty Pink */
      --primary-dark: #b85b72;  /* Soft Crimson */
      --accent: #f8ecee;        /* Soft Blush Pink */
      --text-main: #3a3335;     /* Soft Charcoal */
      --text-muted: #7d7376;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border-color: #f1e2e5;
      --shadow-soft: 0 10px 30px rgba(212, 122, 143, 0.08);
      --shadow-hover: 0 15px 35px rgba(212, 122, 143, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 40px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header .subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--primary-dark);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      color: var(--text-main);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .header-divider {
      width: 60px;
      height: 3px;
      background: var(--primary);
      margin: 0 auto;
      border-radius: 2px;
    }

    /* Controls: Search Bar & Info */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 24px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-soft);
      margin-bottom: 35px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 420px;
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 45px;
      border: 1px solid var(--border-color);
      border-radius: 30px;
      outline: none;
      font-size: 0.95rem;
      background: #ffffff;
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(212, 122, 143, 0.15);
    }

    .stats-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Loading Spinner */
    .loading {
      text-align: center;
      padding: 60px 0;
    }

    .spinner {
      display: inline-block;
      width: 45px;
      height: 45px;
      border: 3px solid rgba(212, 122, 143, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    /* Card Item */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--shadow-soft);
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), var(--primary));
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px dashed var(--border-color);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.25rem;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .student-info h3 {
      font-size: 1.1rem;
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.3;
    }

    .student-info .no-badge {
      font-size: 0.75rem;
      color: var(--primary-dark);
      background: var(--accent);
      padding: 2px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Capaian Item */
    .capaian-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .capaian-item {
      background: rgba(255, 255, 255, 0.65);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid #fceef1;
    }

    .capaian-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .capaian-label i {
      color: var(--primary);
    }

    .capaian-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Empty State */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .header h1 { font-size: 2rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="subtitle">Laporan Akademik & Hafalan</div>
      <h1>Capaian Siswi</h1>
      <div class="header-divider"></div>
    </header>

    <!-- Controls / Filtering -->
    <div class="controls">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Cari nama siswi..." onkeyup="filterData()">
      </div>
      <div class="stats-info" id="statsInfo">
        Memuat data...
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p style="margin-top: 15px; color: var(--text-muted); font-size: 0.9rem;">Menghubungkan ke database...</p>
    </div>

    <!-- Cards Container -->
    <div id="gridContainer" class="grid-container" style="display: none;"></div>
  </div>

  <script>
    // URL Deployment Google Apps Script Terbaru Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPO-G1ASo01Bb9zqYvsQVieZ4tYe9mhbbnv7aeZ3bdxQ56xoF3Rgq4rwP9uE6yHRBesA/exec";

    let allData = [];

    // Jalankan pengambilan data menggunakan metode JSONP
    window.onload = function() {
      fetchDataJSONP();
    };

    function fetchDataJSONP() {
      // Membuat nama callback acak yang unik
      const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
      
      // Mendaftarkan callback fungsi ke objek global window
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) {
          document.body.removeChild(script);
        }
        renderCards(data);
      };

      // Membuat tag script secara dinamis untuk request JSONP
      const script = document.createElement('script');
      script.src = `${SCRIPT_URL}?callback=${callbackName}`;
      
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) {
          document.body.removeChild(script);
        }
        showError(new Error("Gagal terhubung ke Google Apps Script"));
      };

      document.body.appendChild(script);
    }

    function renderCards(data) {
      if (data && data.error) {
        showError(new Error(data.error));
        return;
      }
      
      allData = Array.isArray(data) ? data : [];
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('gridContainer');
      container.style.display = 'grid';
      
      displayFilteredData(allData);
    }

    function displayFilteredData(data) {
      const container = document.getElementById('gridContainer');
      const statsInfo = document.getElementById('statsInfo');
      container.innerHTML = '';

      statsInfo.innerText = `Menampilkan ${data.length} dari ${allData.length} Siswi`;

      if (!data || data.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <i class="fa-regular fa-folder-open" style="font-size: 2.2rem; margin-bottom: 12px; color: var(--primary);"></i>
            <p>Data siswi tidak ditemukan</p>
          </div>`;
        return;
      }

      data.forEach(item => {
        // Ambil huruf pertama nama untuk ditampilkan sebagai avatar
        const initial = item.nama ? item.nama.charAt(0).toUpperCase() : '?';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="avatar">${initial}</div>
            <div class="student-info">
              <h3>${item.nama || '-'}</h3>
              <span class="no-badge">No. Urut: ${item.no || '-'}</span>
            </div>
          </div>
          <div class="capaian-group">
            <div class="capaian-item">
              <div class="capaian-label">
                <i class="fa-solid fa-bookmark"></i> Capaian Awal
              </div>
              <div class="capaian-value">${item.capaianAwal || '-'}</div>
            </div>
            <div class="capaian-item">
              <div class="capaian-label">
                <i class="fa-solid fa-star"></i> Capaian Akhir
              </div>
              <div class="capaian-value">${item.capaianAkhir || '-'}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(item => 
        item.nama && item.nama.toString().toLowerCase().includes(query)
      );
      displayFilteredData(filtered);
    }

    function showError(err) {
      document.getElementById('loading').innerHTML = `
        <div style="color: #d9534f; background: rgba(217, 83, 79, 0.1); padding: 15px 20px; border-radius: 12px; display: inline-block;">
          <i class="fa-solid fa-triangle-exclamation" style="margin-right: 8px;"></i>
          Gagal memuat data: ${err.message}
        </div>
      `;
    }
  </script>
</body>
</html>
