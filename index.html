<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capaian Hafalan Kelas XII</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Palette Dark Glassmorphism Neon */
      --bg-gradient: radial-gradient(circle at 10% 20%, #0d0f18 0%, #05060a 90%);
      --neon-green: #00ffcc;
      --neon-blue: #0099ff;
      --neon-purple: #a855f7;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      --card-bg: rgba(15, 23, 42, 0.65);
      --card-border: rgba(255, 255, 255, 0.12);
      
      --shadow-neon: 0 0 25px rgba(0, 255, 204, 0.15);
      --shadow-hover: 0 10px 30px rgba(168, 85, 247, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Glowing Background Orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.35;
    }

    body::before {
      width: 320px;
      height: 320px;
      background: var(--neon-purple);
      top: 5%;
      left: 10%;
    }

    body::after {
      width: 380px;
      height: 380px;
      background: var(--neon-blue);
      bottom: 10%;
      right: 10%;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header .subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--neon-green);
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 50%, var(--neon-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .header-divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue), var(--neon-purple));
      margin: 0 auto;
      border-radius: 2px;
      box-shadow: 0 0 12px var(--neon-blue);
    }

    /* Portal Class Input Box */
    .login-box {
      max-width: 450px;
      margin: 0 auto;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 35px 30px;
      border-radius: 24px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), var(--shadow-neon);
      text-align: center;
    }

    .login-box i.icon-header {
      font-size: 2.8rem;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }

    .login-box h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .login-box p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--neon-green);
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 15px rgba(0, 153, 255, 0.4);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 255, 204, 0.5);
    }

    /* Dashboard Section */
    .dashboard {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 16px 24px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-neon);
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .class-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .class-badge h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      color: #fff;
    }

    .btn-change {
      background: rgba(255, 255, 255, 0.05);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-change:hover {
      background: var(--neon-green);
      color: #05060a;
      box-shadow: 0 0 15px var(--neon-green);
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 350px;
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-blue);
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 42px;
      border: 1px solid var(--card-border);
      border-radius: 30px;
      outline: none;
      font-size: 0.9rem;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.4);
    }

    /* Loading Spinner */
    .loading {
      text-align: center;
      padding: 50px 0;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 45px;
      height: 45px;
      border: 3px solid rgba(0, 255, 204, 0.1);
      border-radius: 50%;
      border-top-color: var(--neon-green);
      animation: spin 1s infinite linear;
      box-shadow: 0 0 15px var(--neon-green);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Card Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue), var(--neon-purple));
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: var(--shadow-hover);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
      padding-bottom: 15px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 255, 204, 0.1);
      color: var(--neon-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      border: 1px solid rgba(0, 255, 204, 0.3);
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }

    .student-info h3 {
      font-size: 1.05rem;
      color: #fff;
      font-weight: 600;
    }

    .student-info .no-badge {
      font-size: 0.75rem;
      color: var(--neon-blue);
      background: rgba(0, 153, 255, 0.12);
      border: 1px solid rgba(0, 153, 255, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 4px;
      font-weight: 600;
    }

    .capaian-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .capaian-item {
      background: rgba(15, 23, 42, 0.5);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .capaian-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .capaian-label i.fa-bookmark {
      color: var(--neon-blue);
    }

    .capaian-label i.fa-star {
      color: var(--neon-purple);
    }

    .capaian-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .top-bar { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. Form Masuk Kelas -->
    <div id="loginSection">
      <header class="header">
        <div class="subtitle">Laporan Hafalan & Akademik</div>
        <h1>Portal Kelas</h1>
        <div class="header-divider"></div>
      </header>

      <div class="login-box">
        <i class="fa-solid fa-graduation-cap icon-header"></i>
        <h2>Masukan Kelas</h2>
        <p>Ketikkan nama kelas untuk melihat laporan (contoh: <b>XII A</b>, <b>XII E</b>)</p>
        
        <form onsubmit="handleClassSubmit(event)">
          <div class="input-group">
            <label for="kelasInput">Nama Kelas</label>
            <input type="text" id="kelasInput" placeholder="Contoh: XII E" required autocomplete="off">
          </div>
          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-arrow-right-to-bracket" style="margin-right: 8px;"></i> Buka Laporan
          </button>
        </form>
      </div>
    </div>

    <!-- 2. Section Dashboard Data -->
    <div id="dashboardSection" class="dashboard">
      <header class="header">
        <div class="subtitle">Laporan Hafalan & Akademik</div>
        <h1>CAPAIAN HAFALAN</h1>
        <div class="header-divider"></div>
      </header>

      <!-- Top Bar / Controls -->
      <div class="top-bar">
        <div class="class-badge">
          <h2 id="displayClassName">Kelas ...</h2>
          <button class="btn-change" onclick="resetClassSelection()">
            <i class="fa-solid fa-rotate-left"></i> Ganti Kelas
          </button>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Cari nama..." onkeyup="filterData()">
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: var(--text-muted); font-size: 0.9rem;">Mengambil data kelas...</p>
      </div>

      <!-- Cards Container -->
      <div id="gridContainer" class="grid-container"></div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyITqk9x-1tGV0rHApjIAun-ZujrNCJ7V2rQyBGuSzfT_7o0yzUXjvi0nqDYu7TLdhABA/exec";

    let currentClass = "";
    let allData = [];

    function handleClassSubmit(e) {
      e.preventDefault();
      const inputVal = document.getElementById('kelasInput').value.trim();
      if (!inputVal) return;

      currentClass = inputVal;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      document.getElementById('displayClassName').innerText = "Kelas " + currentClass;

      fetchClassDataJSONP(currentClass);
    }

    function resetClassSelection() {
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('gridContainer').innerHTML = '';
      document.getElementById('searchInput').value = '';
      allData = [];
    }

    function fetchClassDataJSONP(namaKelas) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('gridContainer').style.display = 'none';

      const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
      
      window[callbackName] = function(response) {
        delete window[callbackName];
        if (script.parentNode) {
          document.body.removeChild(script);
        }

        if (response && response.error) {
          showError(response.error);
        } else {
          renderCards(response.data || []);
        }
      };

      const script = document.createElement('script');
      script.src = `${SCRIPT_URL}?kelas=${encodeURIComponent(namaKelas)}&callback=${callbackName}`;
      
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) {
          document.body.removeChild(script);
        }
        showError("Gagal terhubung ke server. Pastikan nama kelas benar.");
      };

      document.body.appendChild(script);
    }

    function renderCards(data) {
      allData = data;
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('gridContainer');
      container.style.display = 'grid';
      
      displayFilteredData(allData);
    }

    function displayFilteredData(data) {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <i class="fa-regular fa-folder-open" style="font-size: 2.2rem; margin-bottom: 12px; color: var(--neon-green);"></i>
            <p>Tidak ada data siswa untuk kelas ini.</p>
          </div>`;
        return;
      }

      data.forEach(item => {
        const initial = item.nama ? item.nama.charAt(0).toUpperCase() : '?';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="avatar">${initial}</div>
            <div class="student-info">
              <h3>${item.nama || '-'}</h3>
              <span class="no-badge">No. Urut: ${item.no || '-'}</span>
            </div>
          </div>
          <div class="capaian-group">
            <div class="capaian-item">
              <div class="capaian-label">
                <i class="fa-solid fa-bookmark"></i> Capaian Awal
              </div>
              <div class="capaian-value">${item.capaianAwal || '-'}</div>
            </div>
            <div class="capaian-item">
              <div class="capaian-label">
                <i class="fa-solid fa-star"></i> Capaian Akhir
              </div>
              <div class="capaian-value">${item.capaianAkhir || '-'}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(item => 
        item.nama && item.nama.toString().toLowerCase().includes(query)
      );
      displayFilteredData(filtered);
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('gridContainer');
      container.style.display = 'block';
      container.innerHTML = `
        <div style="text-align: center; color: #ff5555; background: rgba(255, 85, 85, 0.1); border: 1px solid rgba(255, 85, 85, 0.3); padding: 20px; border-radius: 16px; margin-top: 20px;">
          <i class="fa-solid fa-triangle-exclamation" style="font-size: 1.5rem; margin-bottom: 8px;"></i>
          <p style="font-weight: 600;">${message}</p>
        </div>
      `;
    }
  </script>
</body>
</html>
