<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hafalan Kelas XII</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Library html2canvas untuk Screenshot -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      /* Palette Dark Glassmorphism Modern & Soft */
      --bg-gradient: radial-gradient(circle at 50% 0%, #111827 0%, #0b0f19 100%);
      
      --neon-green: #10b981;  /* Soft Emerald Green */
      --neon-blue: #3b82f6;   /* Soft Royal Blue */
      --neon-purple: #8b5cf6; /* Soft Violet Purple */
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      
      --shadow-neon: 0 10px 30px -10px rgba(59, 130, 246, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Soft Ambient Glowing Orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      opacity: 0.25;
    }

    body::before {
      width: 350px;
      height: 350px;
      background: var(--neon-purple);
      top: -5%;
      left: 10%;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: var(--neon-blue);
      bottom: -5%;
      right: 10%;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header .subtitle {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--neon-green);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-divider {
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue), var(--neon-purple));
      margin: 0 auto;
      border-radius: 2px;
    }

    /* Portal Class Selection Box */
    .login-box {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 28px 24px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), var(--shadow-neon);
      text-align: center;
    }

    .login-box i.icon-header {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .login-box h2 {
      font-size: 1.15rem;
      margin-bottom: 6px;
      color: #fff;
      font-weight: 700;
    }

    .login-box p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Pemisahan Kelompok Tombol Kelas (ABCD & EFGH) */
    .class-groups-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .class-group-divider {
      border-top: 1px dashed var(--card-border);
      position: relative;
      margin: 4px 0;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn-class-option {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .btn-class-option i {
      font-size: 0.88rem;
      color: var(--neon-blue);
      transition: color 0.25s ease;
    }

    .btn-class-option:hover {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
      border-color: var(--neon-green);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn-class-option:hover i {
      color: var(--neon-green);
    }

    /* Dashboard Section */
    .dashboard {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-neon);
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .class-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .class-badge h2 {
      font-size: 1.05rem;
      color: #fff;
      font-weight: 700;
    }

    .btn-change {
      background: rgba(255, 255, 255, 0.05);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      letter-spacing: 0.3px;
    }

    .btn-change:hover {
      background: var(--neon-green);
      color: #0b0f19;
      box-shadow: 0 0 10px var(--neon-green);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-screenshot {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-screenshot:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 220px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-blue);
      font-size: 0.8rem;
    }

    .search-box input {
      width: 100%;
      padding: 7px 12px 7px 32px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      outline: none;
      font-size: 0.8rem;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .search-box input:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
    }

    /* Loading Spinner */
    .loading {
      text-align: center;
      padding: 40px 0;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 2px solid rgba(16, 185, 129, 0.1);
      border-radius: 50%;
      border-top-color: var(--neon-green);
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Table Layout - Ringkas & Kompak */
    .table-container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }

    .student-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.82rem;
    }

    .student-table th {
      background: rgba(15, 23, 42, 0.85);
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }

    .student-table th.col-no { width: 60px; text-align: center; }
    .student-table th.col-nama { width: 45%; }
    .student-table th.col-capaian { width: 45%; }

    .student-table td {
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      vertical-align: middle;
      transition: background 0.2s ease;
    }

    .student-table tbody tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .student-table tbody tr:last-child td {
      border-bottom: none;
    }

    .td-no {
      text-align: center;
    }

    .no-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--neon-blue);
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 1px 6px;
      border-radius: 6px;
    }

    .student-name {
      font-weight: 500;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .avatar {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      color: var(--neon-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.72rem;
      border: 1px solid rgba(16, 185, 129, 0.25);
      flex-shrink: 0;
    }

    .capaian-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #e2e8f0;
      font-weight: 500;
    }

    .capaian-tag i.fa-star { 
      color: var(--neon-purple); 
      font-size: 0.75rem; 
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    @media (max-width: 600px) {
      .class-grid { grid-template-columns: repeat(2, 1fr); }
      .top-bar { flex-direction: column; align-items: stretch; }
      .controls-right { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
      .student-table th, .student-table td { padding: 8px 10px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. Form Pilih Kelas -->
    <div id="loginSection">
      <header class="header">
        <div class="subtitle">Laporan Al Quran Kelas XII</div>
        <h1>PROGRES HAFALAN</h1>
        <div class="header-divider"></div>
      </header>

      <div class="login-box">
        <i class="fa-solid fa-graduation-cap icon-header"></i>
        <h2>PILIH KELAS</h2>
        <p>Klik kelas Anda untuk melihat laporan capaian hafalan</p>
        
        <div class="class-groups-wrapper">
          <!-- Kelompok 1: XII A - XII D -->
          <div class="class-grid">
            <button type="button" class="btn-class-option" onclick="selectClass('XII A')">
              <i class="fa-solid fa-users"></i> XII A
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII B')">
              <i class="fa-solid fa-users"></i> XII B
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII C')">
              <i class="fa-solid fa-users"></i> XII C
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII D')">
              <i class="fa-solid fa-users"></i> XII D
            </button>
          </div>

          <!-- Pemisah Kelompok Tombol -->
          <div class="class-group-divider"></div>

          <!-- Kelompok 2: XII E - XII H -->
          <div class="class-grid">
            <button type="button" class="btn-class-option" onclick="selectClass('XII E')">
              <i class="fa-solid fa-users"></i> XII E
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII F')">
              <i class="fa-solid fa-users"></i> XII F
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII G')">
              <i class="fa-solid fa-users"></i> XII G
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII H')">
              <i class="fa-solid fa-users"></i> XII H
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Dashboard Section -->
    <div id="dashboardSection" class="dashboard">
      <!-- Area yang akan di-screenshot -->
      <div id="exportArea">
        <header class="header">
          <div class="subtitle">Laporan Capaian Hafalan Kelas XII</div>
          <h1>PROGRES HAFALAN</h1>
          <div class="header-divider"></div>
        </header>

        <!-- Top Bar / Controls -->
        <div class="top-bar">
          <div class="class-badge">
            <h2 id="displayClassName">Kelas ...</h2>
            <button class="btn-change" id="btnChangeClass" onclick="resetClassSelection()">
              <i class="fa-solid fa-rotate-left"></i> PILIH KELAS
            </button>
          </div>

          <div class="controls-right">
            <button class="btn-screenshot" id="btnScreenshot" onclick="takeFullScreenshot()">
              <i class="fa-solid fa-camera"></i> <span>Download Gambar</span>
            </button>

            <div class="search-box" id="searchBoxContainer">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="searchInput" placeholder="Cari nama..." onkeyup="filterData()">
            </div>
          </div>
        </div>

        <!-- Table Container -->
        <div id="tableContainer" class="table-container">
          <table class="student-table">
            <thead>
              <tr>
                <th class="col-no">No</th>
                <th class="col-nama">Nama Siswa</th>
                <th class="col-capaian">Capaian Akhir</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Data dimasukkan via JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 12px; color: var(--text-muted); font-size: 0.8rem;">Mengambil data kelas...</p>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXWT83MQxjmu3H5UUgz6rNcOhokyuLRITamFnAeqxzV3UngpwtI0DRlYvcHVrnM93S_w/exec";

    let currentClass = "";
    let allData = [];

    function selectClass(namaKelas) {
      currentClass = namaKelas;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      document.getElementById('displayClassName').innerText = "Kelas " + currentClass;

      fetchClassData(currentClass);
    }

    function resetClassSelection() {
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('searchInput').value = '';
      allData = [];
    }

    async function fetchClassData(namaKelas) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('tableContainer').style.display = 'none';

      try {
        const targetUrl = `${SCRIPT_URL}?kelas=${encodeURIComponent(namaKelas)}&_t=${new Date().getTime()}`;
        
        const response = await fetch(targetUrl, {
          method: "GET",
          redirect: "follow",
          credentials: "omit"
        });

        if (!response.ok) {
          throw new Error("Gagal terhubung ke server.");
        }

        const result = await response.json();

        if (result.error) {
          showError(result.error);
        } else {
          // Menyaring baris kosong / tidak valid
          const validStudents = (result.data || []).filter(item => {
            const hasNama = item.nama && item.nama.toString().trim() !== '';
            const hasNo = item.no && item.no.toString().trim() !== '' && item.no.toString().trim() !== '-';
            return hasNama && hasNo;
          });

          renderTable(validStudents);
        }
      } catch (err) {
        showError("Gagal mengambil data. Pastikan koneksi internet stabil dan coba lagi.");
      }
    }

    function renderTable(data) {
      allData = data;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tableContainer').style.display = 'block';
      
      displayFilteredData(allData);
    }

    function displayFilteredData(data) {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      if (!data || data.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="3">
              <div class="no-results">
                <i class="fa-regular fa-folder-open" style="font-size: 1.8rem; margin-bottom: 8px; color: var(--neon-green);"></i>
                <p>Tidak ada data siswa untuk kelas ini.</p>
              </div>
            </td>
          </tr>`;
        return;
      }

      data.forEach(item => {
        const initial = item.nama ? item.nama.toString().charAt(0).toUpperCase() : '?';

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="td-no">
            <span class="no-badge">${item.no || '-'}</span>
          </td>
          <td>
            <div class="student-name">
              <div class="avatar">${initial}</div>
              <span>${item.nama || '-'}</span>
            </div>
          </td>
          <td>
            <div class="capaian-tag">
              <i class="fa-solid fa-star"></i>
              <span>${item.capaianAkhir || '-'}</span>
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(item => 
        item.nama && item.nama.toString().toLowerCase().includes(query)
      );
      displayFilteredData(filtered);
    }

    /* Fungsi untuk mengambil screenshot seluruh data dalam 1 kelas */
    async function takeFullScreenshot() {
      const exportArea = document.getElementById('exportArea');
      const btnScreenshot = document.getElementById('btnScreenshot');
      const btnChangeClass = document.getElementById('btnChangeClass');
      const searchBoxContainer = document.getElementById('searchBoxContainer');

      // Ubah status tombol screenshot saat proses berlangsung
      const originalBtnText = btnScreenshot.innerHTML;
      btnScreenshot.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
      btnScreenshot.style.pointerEvents = "none";

      // Sembunyikan elemen yang tidak perlu ditangkap dalam gambar (tombol & search bar)
      btnChangeClass.style.visibility = 'hidden';
      btnScreenshot.style.visibility = 'hidden';
      searchBoxContainer.style.visibility = 'hidden';

      // Pastikan kata pencarian dikosongkan agar menampilkan seluruh siswa saat screenshot
      const currentSearch = document.getElementById('searchInput').value;
      if (currentSearch) {
        displayFilteredData(allData);
      }

      try {
        // Ambil screenshot area tabel menggunakan html2canvas
        const canvas = await html2canvas(exportArea, {
          backgroundColor: '#0b0f19', // Background yang sama dengan tema gelap
          scale: 2,                   // Kualitas gambar tajam (HD)
          useCORS: true,              // Mendukung pemuatan font eksternal
          logging: false
        });

        // Buat file unduhan berupa PNG
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = `Progres_Hafalan_${currentClass.replace(/\s+/g, '_')}.png`;
        link.href = image;
        link.click();

      } catch (err) {
        alert("Gagal mengambil screenshot. Silakan coba lagi.");
        console.error(err);
      } finally {
        // Kembalikan tombol & search bar ke tampilan semula
        btnChangeClass.style.visibility = 'visible';
        btnScreenshot.style.visibility = 'visible';
        searchBoxContainer.style.visibility = 'visible';
        btnScreenshot.innerHTML = originalBtnText;
        btnScreenshot.style.pointerEvents = "auto";

        // Kembalikan hasil filter jika sebelumnya pengguna melakukan pencarian
        if (currentSearch) {
          filterData();
        }
      }
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tableContainer').style.display = 'block';
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = `
        <tr>
          <td colspan="3">
            <div style="text-align: center; color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); padding: 14px; border-radius: 10px; margin: 15px;">
              <i class="fa-solid fa-triangle-exclamation" style="font-size: 1.1rem; margin-bottom: 5px;"></i>
              <p style="font-weight: 600; font-size: 0.82rem;">${message}</p>
            </div>
          </td>
        </tr>
      `;
    }
  </script>
</body>
</html>
