<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hafalan Kelas XII</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Palette Dark Glassmorphism Presisi */
      --bg-gradient: radial-gradient(circle at 50% 0%, #0d1322 0%, #070a12 100%);
      
      --neon-green: #10b981;  
      --neon-blue: #3b82f6;   
      --neon-purple: #8b5cf6; 
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --shadow-neon: 0 10px 30px -10px rgba(59, 130, 246, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Soft Ambient Glowing Orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      opacity: 0.2;
    }

    body::before {
      width: 300px;
      height: 300px;
      background: var(--neon-purple);
      top: -5%;
      left: 10%;
    }

    body::after {
      width: 350px;
      height: 350px;
      background: var(--neon-blue);
      bottom: -5%;
      right: 10%;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header Styling Presisi */
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }

    .header .subtitle {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-green);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header h1 {
      font-size: 1.6rem;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header-divider {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue), var(--neon-purple));
      margin: 0 auto;
      border-radius: 3px;
    }

    /* Portal Class Selection Box */
    .login-box {
      max-width: 500px;
      margin: 0 auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 28px 24px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .login-box i.icon-header {
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .login-box h2 {
      font-size: 1.25rem;
      margin-bottom: 6px;
      color: #fff;
      font-weight: 700;
    }

    .login-box p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Grid Tombol Pilihan Kelas */
    .class-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn-class-option {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-class-option i {
      font-size: 0.95rem;
      color: var(--neon-blue);
    }

    .btn-class-option:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--neon-green);
      color: #ffffff;
    }

    /* Dashboard Section */
    .dashboard {
      display: none;
    }

    /* Top Bar Kartu Ringkas */
    .top-bar {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-neon);
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .class-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .class-badge h2 {
      font-size: 1.15rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .btn-change {
      background: transparent;
      color: var(--neon-green);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-change:hover {
      background: var(--neon-green);
      color: #0b0f19;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-blue);
      font-size: 0.85rem;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      outline: none;
      font-size: 0.85rem;
      background: rgba(10, 15, 26, 0.6);
      color: var(--text-main);
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .search-box input:focus {
      border-color: var(--neon-blue);
    }

    /* Loading Spinner */
    .loading {
      text-align: center;
      padding: 40px 0;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(16, 185, 129, 0.1);
      border-radius: 50%;
      border-top-color: var(--neon-green);
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Table Layout Presisi */
    .table-container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }

    .student-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    .student-table th {
      background: rgba(10, 15, 26, 0.7);
      padding: 12px 14px;
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }

    .student-table th.col-no { width: 50px; text-align: center; }
    .student-table th.col-nama { width: 50%; }
    .student-table th.col-capaian { width: 40%; }

    .student-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      vertical-align: middle;
    }

    .student-table tbody tr:last-child td {
      border-bottom: none;
    }

    .td-no {
      text-align: center;
    }

    .no-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--neon-blue);
      background: rgba(59, 130, 246, 0.15);
      border-radius: 50%;
    }

    .student-name {
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      color: var(--neon-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .capaian-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .capaian-tag i.fa-star { 
      color: var(--neon-purple); 
      font-size: 0.8rem;
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .class-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. Form Pilih Kelas -->
    <div id="loginSection">
      <header class="header">
        <div class="subtitle">Laporan Al Quran Kelas XII</div>
        <h1>PROGRES HAFALAN</h1>
        <div class="header-divider"></div>
      </header>

      <div class="login-box">
        <i class="fa-solid fa-graduation-cap icon-header"></i>
        <h2>PILIH KELAS</h2>
        <p>Klik kelas Anda untuk langsung melihat laporan</p>
        
        <div class="class-grid">
          <button type="button" class="btn-class-option" onclick="selectClass('XII A')">
            <i class="fa-solid fa-users"></i> XII A
          </button>
          <button type="button" class="btn-class-option" onclick="selectClass('XII B')">
            <i class="fa-solid fa-users"></i> XII B
          </button>
          <button type="button" class="btn-class-option" onclick="selectClass('XII C')">
            <i class="fa-solid fa-users"></i> XII C
          </button>
          <button type="button" class="btn-class-option" onclick="selectClass('XII D')">
            <i class="fa-solid fa-users"></i> XII D
          </button>
          <button type="button" class="btn-class-option" onclick="selectClass('XII E')">
            <i class="fa-solid fa-users"></i> XII E
          </button>
          <button type="button" class="btn-class-option" onclick="selectClass('XII F')">
            <i class="fa-solid fa-users"></i> XII F
          </button>
          <button type="button" class="btn-class-option" onclick="selectClass('XII G')">
            <i class="fa-solid fa-users"></i> XII G
          </button>
          <button type="button" class="btn-class-option" onclick="selectClass('XII H')">
            <i class="fa-solid fa-users"></i> XII H
          </button>
        </div>
      </div>
    </div>

    <!-- 2. Dashboard Section -->
    <div id="dashboardSection" class="dashboard">
      <header class="header">
        <div class="subtitle">Laporan Capaian Hafalan Kelas XII</div>
        <h1>PROGRES HAFALAN</h1>
        <div class="header-divider"></div>
      </header>

      <!-- Top Bar / Controls -->
      <div class="top-bar">
        <div class="class-badge">
          <h2 id="displayClassName">Kelas ...</h2>
          <button class="btn-change" onclick="resetClassSelection()">
            <i class="fa-solid fa-rotate-left"></i> PILIH KELAS
          </button>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Cari nama..." onkeyup="filterData()">
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: var(--text-muted); font-size: 0.85rem;">Mengambil data kelas...</p>
      </div>

      <!-- Table Container -->
      <div id="tableContainer" class="table-container">
        <table class="student-table">
          <thead>
            <tr>
              <th class="col-no">No</th>
              <th class="col-nama">Nama Siswa</th>
              <th class="col-capaian">Capaian Akhir</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Data dimasukkan via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyITqk9x-1tGV0rHApjIAun-ZujrNCJ7V2rQyBGuSzfT_7o0yzUXjvi0nqDYu7TLdhABA/exec";

    let currentClass = "";
    let allData = [];

    function selectClass(namaKelas) {
      currentClass = namaKelas;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      document.getElementById('displayClassName').innerText = "Kelas " + currentClass;

      fetchClassData(currentClass);
    }

    function resetClassSelection() {
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('searchInput').value = '';
      allData = [];
    }

    async function fetchClassData(namaKelas) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('tableContainer').style.display = 'none';

      try {
        const targetUrl = `${SCRIPT_URL}?kelas=${encodeURIComponent(namaKelas)}&_t=${new Date().getTime()}`;
        
        const response = await fetch(targetUrl, {
          method: "GET",
          redirect: "follow",
          credentials: "omit"
        });

        if (!response.ok) {
          throw new Error("Gagal terhubung ke server.");
        }

        const result = await response.json();

        if (result.error) {
          showError(result.error);
        } else {
          renderTable(result.data || []);
        }
      } catch (err) {
        showError("Gagal mengambil data. Pastikan koneksi internet stabil dan coba lagi.");
      }
    }

    function renderTable(data) {
      allData = data;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tableContainer').style.display = 'block';
      
      displayFilteredData(allData);
    }

    function displayFilteredData(data) {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      if (!data || data.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="3">
              <div class="no-results">
                <i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 10px; color: var(--neon-green);"></i>
                <p>Tidak ada data siswa untuk kelas ini.</p>
              </div>
            </td>
          </tr>`;
        return;
      }

      data.forEach(item => {
        const initial = item.nama ? item.nama.toString().charAt(0).toUpperCase() : '?';

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="td-no">
            <span class="no-badge">${item.no || '-'}</span>
          </td>
          <td>
            <div class="student-name">
              <div class="avatar">${initial}</div>
              <span>${item.nama || '-'}</span>
            </div>
          </td>
          <td>
            <div class="capaian-tag">
              <i class="fa-solid fa-star"></i>
              <span>${item.capaianAkhir || '-'}</span>
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(item => 
        item.nama && item.nama.toString().toLowerCase().includes(query)
      );
      displayFilteredData(filtered);
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tableContainer').style.display = 'block';
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = `
        <tr>
          <td colspan="3">
            <div style="text-align: center; color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); padding: 18px; border-radius: 12px; margin: 20px;">
              <i class="fa-solid fa-triangle-exclamation" style="font-size: 1.2rem; margin-bottom: 6px;"></i>
              <p style="font-weight: 600; font-size: 0.9rem;">${message}</p>
            </div>
          </td>
        </tr>
      `;
    }
  </script>
</body>
</html>
