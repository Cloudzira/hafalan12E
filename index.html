<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelas 12</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Library html2canvas untuk Fitur Screenshot -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      /* Palette Dark Glassmorphism Modern & Soft */
      --bg-gradient: #0b0f19;
      
      --neon-green: #10b981;  /* Soft Emerald Green */
      --neon-blue: #3b82f6;   /* Soft Royal Blue */
      --neon-purple: #8b5cf6; /* Soft Violet Purple */
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --card-bg: #111827;
      --card-border: rgba(255, 255, 255, 0.08);
      
      --shadow-neon: 0 10px 30px -10px rgba(59, 130, 246, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background-color: #0b0f19;
      background-image: radial-gradient(circle at 50% 0%, #111827 0%, #0b0f19 100%);
      min-height: 100vh;
      color: var(--text-main);
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 5px;
    }

    .header .subtitle {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-green);
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 8px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .header-divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue), var(--neon-purple));
      margin: 0 auto;
      border-radius: 4px;
    }

    /* Portal Class Selection Box */
    .login-box {
      max-width: 520px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px 24px;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .login-box i.icon-header {
      font-size: 2.2rem;
      color: var(--neon-green);
      margin-bottom: 12px;
    }

    .login-box h2 {
      font-size: 1.2rem;
      margin-bottom: 6px;
      color: #fff;
      font-weight: 700;
    }

    .login-box p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Pemisahan Kelompok Tombol Kelas */
    .class-group {
      margin-bottom: 14px;
    }

    .class-group-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: left;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn-class-option {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-class-option i {
      font-size: 0.9rem;
      color: var(--neon-blue);
    }

    .btn-class-option:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--neon-green);
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* Dashboard Section */
    .dashboard {
      display: none;
    }

    /* Panel Kelas Baru: Layout Berjajar */
    .top-bar {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .panel-header h2 {
      font-size: 1rem;
      color: #fff;
      font-weight: 700;
    }

    .download-date-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      border: 1px solid var(--card-border);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .panel-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-change {
      background: rgba(255, 255, 255, 0.05);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-screenshot {
      background: rgba(59, 130, 246, 0.15);
      color: var(--neon-blue);
      border: 1px solid var(--neon-blue);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-screenshot:hover {
      background: var(--neon-blue);
      color: #ffffff;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 240px;
    }

    .search-box i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-blue);
      font-size: 0.75rem;
    }

    .search-box input {
      width: 100%;
      padding: 6px 10px 6px 30px;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      outline: none;
      font-size: 0.75rem;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      font-family: inherit;
    }

    /* Loading Spinner */
    .loading {
      text-align: center;
      padding: 30px 0;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(16, 185, 129, 0.1);
      border-radius: 50%;
      border-top-color: var(--neon-green);
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Table Layout */
    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }

    .student-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.7rem;
    }

    .student-table th {
      background: rgba(15, 23, 42, 0.95);
      padding: 7px 10px;
      font-weight: 600;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }

    .student-table th.col-no { width: 45px; text-align: center; }
    .student-table th.col-nama { width: 45%; }
    .student-table th.col-capaian { width: 45%; }

    .student-table td {
      padding: 6px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      vertical-align: middle;
    }

    .td-no { text-align: center; }

    .no-badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--neon-blue);
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .student-name {
      font-weight: 500;
      font-size: 0.72rem;
      color: #ffffff;
    }

    .capaian-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      color: var(--text-main);
    }

    .capaian-tag i.fa-star { 
      color: var(--neon-purple); 
      font-size: 0.62rem;
    }

    .no-results {
      text-align: center;
      padding: 30px 15px;
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    /* Footer Styling */
    .app-footer {
      text-align: center;
      padding: 16px 0 8px 0;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .class-grid { grid-template-columns: repeat(2, 1fr); }
      .panel-controls { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
      .student-table th, .student-table td { padding: 5px 6px; font-size: 0.68rem; }
    }
  </style>
</head>
<body>

  <div class="container" id="exportArea">
    
    <!-- 1. Form Pilih Kelas -->
    <div id="loginSection">
      <header class="header">
        <div class="subtitle">Laporan Al Quran Kelas XII</div>
        <h1>PROGRES HAFALAN</h1>
        <div class="header-divider"></div>
      </header>

      <div class="login-box">
        <i class="fa-solid fa-graduation-cap icon-header"></i>
        <h2>PILIH KELAS</h2>
        <p>Klik kelas Anda untuk melihat laporan</p>
        
        <!-- Kelompok 1: Kelas Putra -->
        <div class="class-group">
          <div class="class-group-label"><i class="fa-solid fa-angle-right"></i> Kelas Putra</div>
          <div class="class-grid">
            <button type="button" class="btn-class-option" onclick="selectClass('XII A')">
              <i class="fa-solid fa-users"></i> XII A
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII B')">
              <i class="fa-solid fa-users"></i> XII B
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII C')">
              <i class="fa-solid fa-users"></i> XII C
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII D')">
              <i class="fa-solid fa-users"></i> XII D
            </button>
          </div>
        </div>

        <!-- Kelompok 2: Kelas Putri -->
        <div class="class-group">
          <div class="class-group-label"><i class="fa-solid fa-angle-right"></i> Kelas Putri</div>
          <div class="class-grid">
            <button type="button" class="btn-class-option" onclick="selectClass('XII E')">
              <i class="fa-solid fa-users"></i> XII E
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII F')">
              <i class="fa-solid fa-users"></i> XII F
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII G')">
              <i class="fa-solid fa-users"></i> XII G
            </button>
            <button type="button" class="btn-class-option" onclick="selectClass('XII H')">
              <i class="fa-solid fa-users"></i> XII H
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- 2. Dashboard Section -->
    <div id="dashboardSection" class="dashboard">
      <header class="header">
        <div class="subtitle">Laporan Al Quran Kelas XII</div>
        <h1>PROGRES SERTIFIKASI</h1>
        <div class="header-divider"></div>
      </header>

      <!-- Panel Kelas dengan Susunan Sejajar -->
      <div class="top-bar">
        <!-- Baris 1: Kelas dan Tanggal Sejajar (Kiri & Kanan) -->
        <div class="panel-header">
          <h2 id="displayClassName">Kelas ...</h2>
          <div class="download-date-tag">
            <i class="fa-regular fa-calendar-days"></i>
            <span id="displayDate">-- --- ----</span>
          </div>
        </div>

        <!-- Baris 2: Tombol Aksi dan Pencarian -->
        <div class="panel-controls">
          <div class="action-buttons">
            <button class="btn-change" onclick="resetClassSelection()" data-html2canvas-ignore="true">
              PILIH KELAS
            </button>
            <button class="btn-screenshot" onclick="downloadImage(event)" data-html2canvas-ignore="true">
              <i class="fa-solid fa-download"></i> UNDUH GAMBAR
            </button>
          </div>

          <div class="search-box" data-html2canvas-ignore="true">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Cari nama..." onkeyup="filterData()">
          </div>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px; color: var(--text-muted); font-size: 0.72rem;">Mengambil data kelas...</p>
      </div>

      <!-- Table Container -->
      <div id="tableContainer" class="table-container">
        <table class="student-table">
          <thead>
            <tr>
              <th class="col-no">No</th>
              <th class="col-nama">Nama Siswa</th>
              <th class="col-capaian">Capaian Akhir</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Data dimasukkan via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 3. Footer Kurniapedia -->
    <footer class="app-footer">
      Kurniapedia | 2026
    </footer>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyITqk9x-1tGV0rHApjIAun-ZujrNCJ7V2rQyBGuSzfT_7o0yzUXjvi0nqDYu7TLdhABA/exec";

    let currentClass = "";
    let allData = [];

    /* Fungsi Mementukan Format Hari & Tanggal dalam Bahasa Indonesia */
    function getFormattedDate() {
      const now = new Date();
      const options = { 
        weekday: 'long', 
        day: 'numeric', 
        month: 'long', 
        year: 'numeric' 
      };
      return now.toLocaleDateString('id-ID', options);
    }

    function selectClass(namaKelas) {
      currentClass = namaKelas;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      document.getElementById('displayClassName').innerText = "Kelas " + currentClass;
      document.getElementById('displayDate').innerText = getFormattedDate();

      fetchClassData(currentClass);
    }

    function resetClassSelection() {
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('searchInput').value = '';
      allData = [];
    }

    async function fetchClassData(namaKelas) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('tableContainer').style.display = 'none';

      try {
        const targetUrl = `${SCRIPT_URL}?kelas=${encodeURIComponent(namaKelas)}&_t=${new Date().getTime()}`;
        
        const response = await fetch(targetUrl, {
          method: "GET",
          redirect: "follow",
          credentials: "omit"
        });

        if (!response.ok) {
          throw new Error("Gagal terhubung ke server.");
        }

        const result = await response.json();

        if (result.error) {
          showError(result.error);
        } else {
          renderTable(result.data || []);
        }
      } catch (err) {
        showError("Gagal mengambil data. Pastikan koneksi internet stabil dan coba lagi.");
      }
    }

    function renderTable(data) {
      allData = data;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tableContainer').style.display = 'block';
      
      displayFilteredData(allData);
    }

    function displayFilteredData(data) {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      if (!data || data.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="3">
              <div class="no-results">
                <i class="fa-regular fa-folder-open" style="font-size: 1.4rem; margin-bottom: 4px; color: var(--neon-green);"></i>
                <p>Tidak ada data siswa untuk kelas ini.</p>
              </div>
            </td>
          </tr>`;
        return;
      }

      data.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="td-no">
            <span class="no-badge">${item.no || '-'}</span>
          </td>
          <td>
            <span class="student-name">${item.nama || '-'}</span>
          </td>
          <td>
            <div class="capaian-tag">
              <i class="fa-solid fa-star"></i>
              <span>${item.capaianAkhir || '-'}</span>
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(item => 
        item.nama && item.nama.toString().toLowerCase().includes(query)
      );
      displayFilteredData(filtered);
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tableContainer').style.display = 'block';
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = `
        <tr>
          <td colspan="3">
            <div style="text-align: center; color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); padding: 10px; border-radius: 8px; margin: 10px;">
              <i class="fa-solid fa-triangle-exclamation" style="font-size: 0.9rem; margin-bottom: 3px;"></i>
              <p style="font-weight: 600; font-size: 0.72rem;">${message}</p>
            </div>
          </td>
        </tr>
      `;
    }

    /* Fungsi Unduh Gambar PNG Langsung Tersimpan */
    async function downloadImage(e) {
      const exportArea = document.getElementById('exportArea');
      const btn = e.currentTarget;
      const originalText = btn.innerHTML;
      
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengunduh...';
      btn.disabled = true;

      try {
        const canvas = await html2canvas(exportArea, {
          backgroundColor: '#0b0f19',
          scale: 2,
          useCORS: true,
          logging: false,
          allowTaint: true,
          windowWidth: exportArea.scrollWidth,
          windowHeight: exportArea.scrollHeight
        });

        const fileName = `Laporan_Hafalan_${currentClass.replace(/\s+/g, '_')}.png`;

        canvas.toBlob(function(blob) {
          if (!blob) {
            alert('Gagal memproses gambar PNG.');
            return;
          }

          const blobUrl = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = fileName;
          
          document.body.appendChild(link);
          link.click();
          
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 200);
        }, 'image/png');

      } catch (err) {
        alert('Gagal mengambil gambar: ' + err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
